# Camera configuration
#
# NOTE:
# The intrinsic parameters below are PLACEHOLDERS.
# They must be replaced with the real calibration values
# obtained from the Spot depth camera in the laboratory.

cameras:
  rgb:
    width: 640
    height: 480

  depth:
    width: 640
    height: 480

    # Depth camera intrinsic parameters
    intrinsics:
      fx: 500.0
      fy: 500.0
      cx: 320.0
      cy: 240.0

    # Conversion from raw depth value to meters.
    #
    # Example:
    #   raw depth = 1000
    #   depth_scale = 0.001
    #   depth = 1.0 m
    #
    # Note: The depth_scale value must be replaced with the real calibration value
    depth_scale: 0.001