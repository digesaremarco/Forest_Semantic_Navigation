# Grid map configuration
#
# Defines the static semantic grid used to fuse the point cloud
# produced by PointCloudBuilder (x, y, z, rgb, softmax per class)
# into per-cell geometric + semantic information.
#
# The grid origin is NOT set here: it is fixed to the first pose
# received by GridMap.update(), since no reliable global/GPS
# reference is assumed in the forest. See GridMap for details.

map:
  # Grid extent in meters (square grid: map_length x map_length).
  # Sized for field tests covering roughly a 20x20 m area.
  map_length: 40.0

  # Cell size in meters.
  resolution: 0.04

# Points falling outside the grid extent (e.g. the robot drifting
# more than map_length/2 from the origin) are dropped, never
# silently ignored: a warning is logged with how many points were
# discarded, if this is enabled.
out_of_bounds_warning: true

# Depth noise model used to weight each point during fusion:
#
#   sigma^2(z) = sigma0^2 + alpha * z^exponent
#
# z is the depth along the camera optical axis (points_xyz[:, 2] in
# the optical frame), NOT the 3D Euclidean distance: stereo depth
# error comes from disparity error, so it is a function of z.
# Each point is fused with weight
#
#   w = sigma^2(reference_distance) / sigma^2(z)
#
# (w = 1 at reference_distance). Setting alpha to 0 disables the
# weighting and reproduces the plain per-point mean.
#
# Calibration (fit_depth_noise.py): per-pixel temporal variance over
# 4 frames with Spot standing still (right camera, testset
# 20260914_145610 .. 145628), median variance per 0.25 m depth bin,
# least-squares fit on the relative error.
#   - log-log slope of sigma vs z: 2.01 (stereo theory: 2.0),
#     confirming exponent = 4 on the variance;
#   - fitted sigma0 ~ 0 (no measurable floor), alpha = 1.7e-5;
#   - model sigma: 0.4 cm @ 1 m, 1.7 cm @ 2 m, 3.7 cm @ 3 m,
#     6.6 cm @ 4 m.
# sigma0 is NOT the fitted value: it is a conservative 3 mm floor
# covering errors the temporal method cannot observe (calibration,
# pose error, systematic bias repeated in every frame). The model
# is assumed to hold for all five stereo pairs (identical hardware).
noise:
  # Variance floor, as a standard deviation [m]. Must be > 0.
  sigma0: 0.003

  # Growth coefficient of the variance with depth [1/m^2 for
  # exponent = 4]. Fitted value.
  alpha: 1.7e-5

  # Exponent of z in the variance (4 for stereo: sigma ~ z^2).
  exponent: 4.0

  # Depth [m] at which a point has weight 1.
  reference_distance: 1.0